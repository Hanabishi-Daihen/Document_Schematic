<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ทุกอย่างถูกฝังตอน build (npm run build) — ไม่มีการโหลดจาก CDN -->
  <!-- @inline fonts -->
  <!-- @inline tailwind -->
  <!-- @inline Styles.html -->
</head>
<body class="bg-canvas text-body font-sans min-h-screen flex flex-col">
  <header class="bg-canvas border-b border-hairline sticky top-0 z-20">
    <div class="max-w-[1200px] mx-auto px-4 sm:px-6 h-16 flex items-center gap-4">
      <a href="#" data-nav="list" class="flex items-center gap-2.5 text-ink">
        <svg class="w-7 h-7 shrink-0" viewBox="0 0 28 28" aria-hidden="true">
          <rect x="7" y="3" width="15" height="20" rx="2.5" fill="none" stroke="#141413" stroke-width="1.75"/>
          <rect x="4" y="6" width="15" height="20" rx="2.5" fill="#faf9f5" stroke="#141413" stroke-width="1.75"/>
          <path d="M8 12h7M8 16h7M8 20h4" stroke="#cc785c" stroke-width="1.75" stroke-linecap="round"/>
        </svg>
        <span class="font-display text-[19px] tracking-[-0.3px] hidden sm:inline">Document Schematic</span>
      </a>
      <nav class="ml-auto flex gap-1">
        <a href="#" data-nav="list" class="tab">เอกสาร</a>
        <a href="#" data-nav="admin" class="tab">Admin</a>
      </nav>
    </div>
  </header>

  <main class="flex-1 w-full max-w-[1200px] mx-auto px-4 sm:px-6 py-8 sm:py-12">
    <!-- รายการเอกสาร -->
    <section id="view-list">
      <h1 class="font-display text-ink text-[28px] sm:text-[36px] leading-[1.15] tracking-[-0.5px]">ค้นหาเอกสาร</h1>
      <p class="mt-2 text-muted">เอกสารทั้งหมดจาก OneDrive พร้อมสถานะการแก้ไขล่าสุด</p>
      <div class="relative mt-6">
        <input id="q" type="search" autocomplete="off" placeholder="ค้นหาชื่อเอกสาร หรือข้อความในเอกสาร…" class="input input-lg input-search">
        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-muted-soft" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </div>
      <div class="mt-4 flex flex-wrap items-center gap-2">
        <div id="chips" class="flex flex-wrap gap-1"></div>
        <select id="category" class="input input-auto ml-auto max-w-full">
          <option value="">ทุกหมวด</option>
        </select>
      </div>
      <div class="mt-4 flex flex-wrap justify-between gap-2 text-[13px] text-muted-soft">
        <span id="count"></span>
        <span id="index-status"></span>
      </div>
      <div id="list" class="mt-3 space-y-2"></div>
    </section>

    <!-- รายละเอียดเอกสาร -->
    <section id="view-detail" class="hidden">
      <button data-nav="list" class="text-link text-sm">← กลับไปรายการเอกสาร</button>
      <div id="detail-head" class="mt-4"></div>
      <div class="mt-6 flex flex-col lg:flex-row gap-6">
        <div class="flex-1 min-w-0">
          <div id="viewer" class="viewer"></div>
        </div>
        <aside class="lg:w-80 shrink-0">
          <h2 class="font-display text-ink text-[22px] tracking-[-0.3px] mb-3">ประวัติการแก้ไข</h2>
          <ol id="history" class="space-y-2"></ol>
        </aside>
      </div>
    </section>

    <!-- Admin -->
    <section id="view-admin" class="hidden">
      <div id="admin-login" class="card max-w-sm mx-auto mt-8">
        <h1 class="font-display text-ink text-[28px] leading-[1.2] tracking-[-0.3px]">เข้าสู่หน้า Admin</h1>
        <form id="login-form" class="mt-6 space-y-3">
          <input id="admin-pw" type="password" placeholder="รหัสผ่าน" class="input">
          <button class="btn btn-primary w-full">เข้าสู่ระบบ</button>
          <p id="login-error" class="text-sm text-error"></p>
        </form>
      </div>
      <div id="admin-panel" class="hidden space-y-6"></div>
    </section>
  </main>

  <footer class="bg-surface-dark text-on-dark-soft text-sm">
    <div class="max-w-[1200px] mx-auto px-4 sm:px-6 py-10 flex flex-wrap gap-x-6 gap-y-2 items-center">
      <span class="font-display text-on-dark text-base">Document Schematic</span>
      <span>เอกสารจาก OneDrive · อัปเดตอัตโนมัติทุก 30 นาที</span>
    </div>
  </footer>

  <div id="toast" class="toast hidden"></div>

  <!-- @inline App.js.html -->
</body>
</html>
