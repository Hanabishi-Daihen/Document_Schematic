<script>
(() => {
  const PDFJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  const BADGES = {
    revised: { label: '🔄 Revised', cls: 'badge-revised' },
    updated: { label: '📝 Updated', cls: 'badge-updated' },
    new: { label: '🆕 New', cls: 'badge-new' },
    missing: { label: '⚠️ Missing', cls: 'badge-missing' },
  };
  const CHANGE_LABEL = { initial: 'เริ่มต้น', revised: '🔄 Revised', updated: '📝 Updated', historical: 'ย้อนหลัง' };
  const FILTERS = [
    ['all', 'ทั้งหมด'], ['revised', '🔄 Revised'], ['updated', '📝 Updated'], ['new', '🆕 New'], ['unread', '🔵 ยังไม่ได้อ่าน'],
  ];

  const state = {
    docs: [],
    contentIndex: null,
    filter: 'all',
    category: '',
    query: '',
    renderToken: 0,
    adminPw: sessionGet('ds_admin_pw') || '',
  };
  const $ = (id) => document.getElementById(id);

  // ---------- utilities ----------
  function call(fn, ...args) {
    return new Promise((resolve, reject) =>
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));
  }
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function normalize(s) {
    return String(s || '').normalize('NFC').toLowerCase().replace(/\s+/g, ' ').trim();
  }
  function fmtDate(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function fmtDateTime(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleString('th-TH', { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' });
  }
  function fmtSize(b) {
    if (!b) return '';
    return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
  }
  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function toast(msg, ms = 3500) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.add('hidden'), ms);
  }
  function errMsg(e) {
    return (e && e.message) || String(e);
  }
  function storageGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function storageSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ไม่มี storage ก็ใช้งานได้ */ } }
  function sessionGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function sessionSet(k, v) { try { v ? sessionStorage.setItem(k, v) : sessionStorage.removeItem(k); } catch (e) { /* ignore */ } }
  function badgeHtml(b) {
    return b && BADGES[b] ? `<span class="badge ${BADGES[b].cls}">${BADGES[b].label}</span>` : '';
  }
  function revHtml(rev) {
    return rev ? `<span class="badge badge-rev">Rev.${esc(rev)}</span>` : '';
  }

  // ---------- "ยังไม่ได้อ่าน" เก็บใน browser ของผู้ใช้ ----------
  const seen = storageGet('ds_seen') || {};
  function isUnread(d) {
    return d.badge && d.badge !== 'missing' && seen[d.id] !== d.versionId;
  }
  function markSeen(d) {
    seen[d.id] = d.versionId;
    storageSet('ds_seen', seen);
  }

  // ---------- views ----------
  function show(view) {
    ['list', 'detail', 'admin'].forEach((v) => $('view-' + v).classList.toggle('hidden', v !== view));
    document.querySelectorAll('.nav-link').forEach((a) =>
      a.classList.toggle('active', a.dataset.nav === (view === 'detail' ? 'list' : view)));
    window.scrollTo(0, 0);
  }
  document.addEventListener('click', (e) => {
    const nav = e.target.closest('[data-nav]');
    if (nav) {
      e.preventDefault();
      if (nav.dataset.nav === 'admin') openAdmin();
      else { show('list'); renderList(); }
    }
  });

  // ---------- โหลดข้อมูล ----------
  async function loadBootstrap() {
    $('list').innerHTML = '<div class="py-16 text-center text-slate-500"><span class="spinner"></span> กำลังโหลด…</div>';
    try {
      const data = await call('getBootstrap');
      state.docs = data.documents.map((d) => Object.assign(d, {
        _title: normalize(d.title),
        _file: normalize(d.fileName),
        _cat: normalize(d.category),
        _tags: normalize(d.tags),
      }));
      $('category').innerHTML = '<option value="">ทุกหมวด</option>' +
        data.categories.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
      $('category').value = state.category;
      renderChips();
      renderList();
      if (data.pending) toast(`มี ${data.pending} ไฟล์รอประมวลผลในรอบ sync ถัดไป`);
      loadContentIndex();
    } catch (e) {
      $('list').innerHTML = `<div class="py-16 text-center text-red-600">โหลดข้อมูลไม่สำเร็จ: ${esc(errMsg(e))}</div>`;
    }
  }

  async function loadContentIndex() {
    $('index-status').textContent = 'กำลังโหลดดัชนีเนื้อหาเอกสาร…';
    try {
      const b64 = await call('getContentIndex');
      if (!b64) { $('index-status').textContent = 'ยังไม่มีดัชนีเนื้อหา (ค้นได้จากชื่อเอกสาร)'; return; }
      const stream = new Blob([b64ToBytes(b64)]).stream().pipeThrough(new DecompressionStream('gzip'));
      state.contentIndex = JSON.parse(await new Response(stream).text()).docs;
      $('index-status').textContent = '✓ ค้นหาในเนื้อหาเอกสารได้';
      if (state.query) renderList();
    } catch (e) {
      $('index-status').textContent = 'โหลดดัชนีเนื้อหาไม่สำเร็จ (ค้นได้จากชื่อเอกสาร)';
      console.error(e);
    }
  }

  // ---------- ค้นหา ----------
  function search() {
    const terms = normalize(state.query).split(' ').filter(Boolean);
    const out = [];
    for (const d of state.docs) {
      if (state.category && d.category !== state.category) continue;
      if (state.filter === 'unread' ? !isUnread(d) : state.filter !== 'all' && d.badge !== state.filter) continue;
      if (!terms.length) { out.push({ d, score: 0 }); continue; }
      let score = 0;
      let snippet = '';
      let ok = true;
      for (const t of terms) {
        let s = 0;
        if (d._title.includes(t)) s = d._title.startsWith(t) ? 150 : 100;
        else if (d._file.includes(t)) s = 60;
        else if (d._tags.includes(t)) s = 50;
        else if (d._cat.includes(t)) s = 30;
        else {
          const c = state.contentIndex && state.contentIndex[d.id] && state.contentIndex[d.id].c;
          const idx = c ? c.indexOf(t) : -1;
          if (idx >= 0) {
            s = 10;
            if (!snippet) snippet = makeSnippet(c, idx, t.length);
          }
        }
        if (!s) { ok = false; break; }
        score += s;
      }
      if (ok) out.push({ d, score, snippet });
    }
    if (terms.length) out.sort((a, b) => b.score - a.score || b.d.updatedAt.localeCompare(a.d.updatedAt));
    return { results: out, terms };
  }

  function makeSnippet(text, idx, len) {
    const start = Math.max(0, idx - 60);
    const end = Math.min(text.length, idx + len + 90);
    return (start ? '…' : '') + text.slice(start, end) + (end < text.length ? '…' : '');
  }

  function highlight(text, terms) {
    let html = esc(text);
    terms.forEach((t) => {
      const et = esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      if (et) html = html.replace(new RegExp(et, 'gi'), (m) => `<mark>${m}</mark>`);
    });
    return html;
  }

  // ---------- รายการเอกสาร ----------
  function renderChips() {
    $('chips').innerHTML = FILTERS.map(([k, label]) =>
      `<button class="chip ${state.filter === k ? 'active' : ''}" data-filter="${k}">${label}</button>`).join('');
  }
  $('chips').addEventListener('click', (e) => {
    const b = e.target.closest('[data-filter]');
    if (!b) return;
    state.filter = b.dataset.filter;
    renderChips();
    renderList();
  });
  $('category').addEventListener('change', (e) => { state.category = e.target.value; renderList(); });
  let qTimer;
  $('q').addEventListener('input', (e) => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { state.query = e.target.value; renderList(); }, 120);
  });

  function renderList() {
    const { results, terms } = search();
    $('count').textContent = `${results.length.toLocaleString('th-TH')} เอกสาร`;
    if (!state.docs.length) {
      $('list').innerHTML = '<div class="py-16 text-center text-slate-500">ยังไม่มีเอกสาร — เพิ่มลิงก์ OneDrive ที่หน้า Admin</div>';
      return;
    }
    if (!results.length) {
      $('list').innerHTML = '<div class="py-16 text-center text-slate-500">ไม่พบเอกสารที่ตรงกับเงื่อนไข</div>';
      return;
    }
    $('list').innerHTML = results.slice(0, 300).map(({ d, snippet }) => `
      <a href="#" data-doc="${esc(d.id)}" class="block bg-white rounded-xl border border-slate-200 hover:border-indigo-300 hover:shadow-sm transition px-4 py-3">
        <div class="flex items-start gap-2">
          ${isUnread(d) ? '<span title="ยังไม่ได้อ่าน" class="mt-2 w-2 h-2 rounded-full bg-blue-500 shrink-0"></span>' : ''}
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-2">
              <span class="font-medium text-slate-900 break-words">${highlight(d.title, terms)}</span>
              ${revHtml(d.rev)} ${badgeHtml(d.badge)}
            </div>
            <div class="mt-1 text-xs text-slate-500 flex flex-wrap gap-x-3 gap-y-1">
              <span>📁 ${esc(d.category)}</span>
              <span>อัปเดต ${fmtDate(d.updatedAt)}</span>
              ${d.versions > 1 ? `<span>${d.versions} เวอร์ชัน</span>` : ''}
            </div>
            ${snippet ? `<div class="mt-2 text-sm text-slate-600 bg-slate-50 rounded-md px-2 py-1 break-words">${highlight(snippet, terms)}</div>` : ''}
          </div>
        </div>
      </a>`).join('') +
      (results.length > 300 ? '<div class="text-center text-xs text-slate-500 py-2">แสดง 300 รายการแรก — พิมพ์คำค้นเพิ่มเพื่อกรอง</div>' : '');
  }
  $('list').addEventListener('click', (e) => {
    const a = e.target.closest('[data-doc]');
    if (!a) return;
    e.preventDefault();
    openDetail(a.dataset.doc);
  });

  // ---------- รายละเอียดเอกสาร ----------
  async function openDetail(docId) {
    const d = state.docs.find((x) => x.id === docId);
    show('detail');
    $('detail-head').innerHTML = `<h2 class="text-xl font-semibold">${esc(d ? d.title : '')}</h2>`;
    $('history').innerHTML = '<li class="text-sm text-slate-500"><span class="spinner"></span></li>';
    $('viewer').innerHTML = '';
    $('viewer-bar').innerHTML = '';
    try {
      const detail = await call('getDocumentDetail', docId);
      const current = detail.versions.find((v) => v.isCurrent) || detail.versions[0];
      $('detail-head').innerHTML = `
        <div class="flex flex-wrap items-center gap-2">
          <h2 class="text-xl font-semibold text-slate-900 break-words">${esc(detail.title)}</h2>
          ${revHtml(detail.rev)} ${d ? badgeHtml(d.badge) : ''}
        </div>
        <div class="mt-1 text-sm text-slate-500 flex flex-wrap gap-x-4">
          <span>📁 ${esc(detail.category)}</span>
          ${current ? `<span>อัปเดต ${fmtDate(current.fileModifiedAt)}${current.modifiedBy ? ' โดย ' + esc(current.modifiedBy) : ''}</span>` : ''}
        </div>`;
      $('history').innerHTML = detail.versions.map((v) => `
        <li>
          <button data-version="${esc(v.id)}" class="w-full text-left bg-white rounded-lg border ${v.isCurrent ? 'border-indigo-400' : 'border-slate-200'} hover:border-indigo-300 px-3 py-2">
            <div class="flex flex-wrap items-center gap-1.5 text-sm">
              <span class="font-medium">v${v.versionNo}</span>
              ${revHtml(v.rev)}
              <span class="text-xs text-slate-600">${CHANGE_LABEL[v.changeType] || esc(v.changeType)}</span>
              ${v.isCurrent ? '<span class="badge badge-new">ปัจจุบัน</span>' : ''}
            </div>
            <div class="text-xs text-slate-500 mt-1">${fmtDate(v.fileModifiedAt)}${v.modifiedBy ? ' · ' + esc(v.modifiedBy) : ''}${v.sizeBytes ? ' · ' + fmtSize(v.sizeBytes) : ''}</div>
            <div class="text-xs text-slate-400 mt-0.5 break-all">${esc(v.fileName)}</div>
            ${v.note ? `<div class="text-xs text-slate-600 mt-1">📝 ${esc(v.note)}</div>` : ''}
          </button>
        </li>`).join('');
      $('history').onclick = (e) => {
        const b = e.target.closest('[data-version]');
        if (b) showVersion(detail.versions.find((v) => v.id === b.dataset.version));
      };
      if (current) showVersion(current);
      if (d) { markSeen(d); }
    } catch (e) {
      $('history').innerHTML = `<li class="text-sm text-red-600">${esc(errMsg(e))}</li>`;
    }
  }

  async function showVersion(v) {
    const token = ++state.renderToken;
    document.querySelectorAll('#history [data-version]').forEach((b) =>
      b.classList.toggle('ring-2', b.dataset.version === v.id));
    $('viewer-bar').innerHTML = `
      <span class="text-slate-600">กำลังดู v${v.versionNo}${v.rev ? ' · Rev.' + esc(v.rev) : ''}</span>
      <span class="ml-auto flex gap-2">
        ${v.webUrl && v.fileStatus !== 'missing' ? `<a href="${esc(v.webUrl)}" target="_blank" rel="noopener" class="px-3 py-1.5 rounded-md border border-slate-300 bg-white hover:bg-slate-50">เปิดใน OneDrive</a>` : ''}
        <button id="dl-btn" class="px-3 py-1.5 rounded-md bg-indigo-600 text-white hover:bg-indigo-700">ดาวน์โหลด</button>
      </span>`;
    $('viewer').innerHTML = '<div class="py-24 text-center text-slate-500"><span class="spinner"></span> กำลังโหลดเอกสาร…</div>';
    let file;
    try {
      file = await call('getVersionFile', v.id);
    } catch (e) {
      if (token === state.renderToken) $('viewer').innerHTML = `<div class="py-24 text-center text-red-600">${esc(errMsg(e))}</div>`;
      return;
    }
    if (token !== state.renderToken) return;
    const bytes = b64ToBytes(file.base64);
    $('dl-btn').onclick = () => {
      const url = URL.createObjectURL(new Blob([bytes], { type: file.mimeType }));
      const a = Object.assign(document.createElement('a'), { href: url, download: file.name });
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    };
    if (!/pdf/i.test(file.mimeType)) {
      $('viewer').innerHTML = '<div class="py-24 text-center text-slate-600">ไฟล์ชนิดนี้แสดงตัวอย่างไม่ได้ กด "ดาวน์โหลด" หรือ "เปิดใน OneDrive"</div>';
      return;
    }
    await renderPdf(bytes.slice(), token);
  }

  let pdfWorkerReady = false;
  function setupPdfWorker() {
    if (pdfWorkerReady) return;
    try {
      // HtmlService ไม่อนุญาต worker ข้ามโดเมนโดยตรง จึงสร้าง worker จาก blob แล้ว importScripts
      const src = `importScripts('${PDFJS_BASE}pdf.worker.min.js');`;
      pdfjsLib.GlobalWorkerOptions.workerPort =
        new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    } catch (e) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js';
    }
    pdfWorkerReady = true;
  }

  async function renderPdf(bytes, token) {
    setupPdfWorker();
    const viewer = $('viewer');
    try {
      const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
      if (token !== state.renderToken) return;
      viewer.innerHTML = '';
      const width = viewer.clientWidth - 16;
      const ratio = window.devicePixelRatio || 1;
      for (let n = 1; n <= pdf.numPages; n++) {
        if (token !== state.renderToken) return;
        const page = await pdf.getPage(n);
        const scale = Math.min(2, width / page.getViewport({ scale: 1 }).width);
        const vp = page.getViewport({ scale: scale * ratio });
        const canvas = document.createElement('canvas');
        canvas.className = 'pdf-page';
        canvas.width = vp.width;
        canvas.height = vp.height;
        canvas.style.width = vp.width / ratio + 'px';
        viewer.appendChild(canvas);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      }
    } catch (e) {
      if (token === state.renderToken) viewer.innerHTML = `<div class="py-24 text-center text-red-600">แสดง PDF ไม่ได้: ${esc(errMsg(e))}</div>`;
    }
  }

  // ---------- Admin ----------
  function openAdmin() {
    show('admin');
    if (state.adminPw) loadAdmin();
    else { $('admin-login').classList.remove('hidden'); $('admin-panel').classList.add('hidden'); }
  }

  $('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('login-error').textContent = '';
    const pw = $('admin-pw').value;
    try {
      await call('adminLogin', pw);
      state.adminPw = pw;
      sessionSet('ds_admin_pw', pw);
      $('admin-pw').value = '';
      loadAdmin();
    } catch (err) {
      $('login-error').textContent = errMsg(err);
    }
  });

  async function loadAdmin() {
    $('admin-login').classList.add('hidden');
    const panel = $('admin-panel');
    panel.classList.remove('hidden');
    panel.innerHTML = '<div class="py-16 text-center text-slate-500"><span class="spinner"></span></div>';
    let s;
    try {
      s = await call('adminGetState', state.adminPw);
    } catch (err) {
      state.adminPw = '';
      sessionSet('ds_admin_pw', '');
      panel.classList.add('hidden');
      $('admin-login').classList.remove('hidden');
      $('login-error').textContent = errMsg(err);
      return;
    }
    const statusCls = { ok: 'text-emerald-700', new: 'text-sky-700', error: 'text-red-600', disabled: 'text-slate-400' };
    panel.innerHTML = `
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        ${[['เอกสาร', s.stats.documents], ['ไฟล์', s.stats.files], ['รอประมวลผล', s.stats.pending], ['ล้มเหลว', s.stats.failed]]
          .map(([k, v]) => `<div class="bg-white rounded-xl border border-slate-200 p-4"><div class="text-xs text-slate-500">${k}</div><div class="text-2xl font-semibold">${v}</div></div>`).join('')}
      </div>

      <div class="bg-white rounded-xl border border-slate-200 p-4">
        <div class="flex flex-wrap items-center gap-2">
          <h3 class="font-semibold">แหล่งเอกสาร (OneDrive)</h3>
          <button id="sync-btn" class="ml-auto px-3 py-1.5 rounded-md bg-indigo-600 text-white text-sm hover:bg-indigo-700">Sync ตอนนี้</button>
          <button id="logout-btn" class="px-3 py-1.5 rounded-md border border-slate-300 text-sm">ออกจากระบบ</button>
        </div>
        <form id="add-source" class="mt-3 grid gap-2 sm:grid-cols-[1fr_200px_auto]">
          <input name="input" required placeholder="วางลิงก์โฟลเดอร์/ไฟล์ OneDrive หรือ อีเมล:/path/โฟลเดอร์" class="h-10 rounded-lg border border-slate-300 px-3 min-w-0">
          <input name="name" placeholder="ชื่อที่แสดง (ไม่บังคับ)" class="h-10 rounded-lg border border-slate-300 px-3 min-w-0">
          <button class="h-10 px-4 rounded-lg bg-slate-900 text-white">เพิ่ม</button>
        </form>
        <div class="mt-3 overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="text-left text-slate-500"><tr><th class="py-2 pr-3">ชื่อ</th><th class="pr-3">ไฟล์</th><th class="pr-3">สถานะ</th><th class="pr-3">sync ล่าสุด</th><th></th></tr></thead>
            <tbody>
              ${s.sources.length ? s.sources.map((src) => `
                <tr class="border-t border-slate-100 align-top">
                  <td class="py-2 pr-3"><div class="font-medium">${esc(src.name)}</div><div class="text-xs text-slate-400 break-all">${esc(src.input)}</div></td>
                  <td class="pr-3">${src.fileCount}</td>
                  <td class="pr-3 ${statusCls[src.status] || ''}">${esc(src.status)}${src.lastError ? `<div class="text-xs text-red-600 max-w-xs break-words">${esc(src.lastError)}</div>` : ''}</td>
                  <td class="pr-3 whitespace-nowrap">${fmtDateTime(src.lastSyncedAt)}</td>
                  <td class="text-right"><button data-toggle-source="${esc(src.id)}" data-status="${src.status === 'disabled' ? 'ok' : 'disabled'}" class="text-xs text-indigo-600 hover:underline">${src.status === 'disabled' ? 'เปิด' : 'ปิด'}</button></td>
                </tr>`).join('') : '<tr><td colspan="5" class="py-4 text-slate-500">ยังไม่มีแหล่งเอกสาร</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 p-4">
        <h3 class="font-semibold">รอยืนยันการจับคู่เอกสาร (${s.review.length})</h3>
        <p class="text-xs text-slate-500 mt-1">ไฟล์ที่ชื่อคล้ายเอกสารเดิมแต่ไม่ตรงกันทุกตัวอักษร</p>
        <div class="mt-3 space-y-2">
          ${s.review.length ? s.review.map((r) => `
            <div class="border border-slate-200 rounded-lg p-3 text-sm">
              <div><span class="text-slate-500">ไฟล์ใหม่:</span> <b class="break-words">${esc(r.fileName)}</b></div>
              <div><span class="text-slate-500">คล้ายกับ:</span> ${esc(r.candidateTitle)} <span class="text-xs text-slate-400">(${Math.round(r.similarity * 100)}%)</span></div>
              <div class="mt-2 flex flex-wrap gap-2">
                <button data-review="${esc(r.id)}" data-action="merge" class="px-3 py-1 rounded-md bg-indigo-600 text-white">เป็นเอกสารเดียวกัน</button>
                <button data-review="${esc(r.id)}" data-action="new" class="px-3 py-1 rounded-md border border-slate-300">แยกเป็นเอกสารใหม่</button>
                <button data-review="${esc(r.id)}" data-action="ignore" class="px-3 py-1 rounded-md text-slate-500">ไม่นำเข้า</button>
              </div>
            </div>`).join('') : '<div class="text-sm text-slate-500">ไม่มีรายการ</div>'}
        </div>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 p-4">
        <h3 class="font-semibold">Log ล่าสุด</h3>
        <div class="mt-2 max-h-80 overflow-auto text-xs font-mono space-y-1">
          ${s.logs.map((l) => `<div class="${l.level === 'ERROR' ? 'text-red-600' : l.level === 'WARN' ? 'text-amber-700' : 'text-slate-600'}">${fmtDateTime(l.time)} [${esc(l.level)}] ${esc(l.message)}</div>`).join('') || '<div class="text-slate-500">ไม่มี log</div>'}
        </div>
      </div>`;

    $('logout-btn').onclick = () => { state.adminPw = ''; sessionSet('ds_admin_pw', ''); openAdmin(); };
    $('sync-btn').onclick = async (e) => {
      e.target.disabled = true;
      e.target.innerHTML = '<span class="spinner"></span> กำลัง sync… (อาจใช้เวลาหลายนาที)';
      try {
        const r = await call('adminSyncNow', state.adminPw);
        toast(r.skipped ? 'มีงาน sync กำลังทำงานอยู่ ลองใหม่ภายหลัง'
          : `sync เสร็จ: ไฟล์ใหม่ ${r.newFiles}, เปลี่ยน ${r.changed}, ประมวลผล ${r.processed}${r.remaining ? `, เหลือ ${r.remaining} (ทำต่อรอบถัดไป)` : ''}`, 6000);
        loadBootstrap();
      } catch (err) { toast('sync ไม่สำเร็จ: ' + errMsg(err), 6000); }
      loadAdmin();
    };
    $('add-source').onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target;
      f.querySelector('button').disabled = true;
      try {
        const r = await call('adminAddSource', state.adminPw, f.input.value, f.name.value);
        toast(`เพิ่ม "${r.name}" แล้ว — กด "Sync ตอนนี้" เพื่อดึงเอกสาร`);
        loadAdmin();
      } catch (err) {
        toast('เพิ่มไม่สำเร็จ: ' + errMsg(err), 6000);
        f.querySelector('button').disabled = false;
      }
    };
    panel.querySelectorAll('[data-toggle-source]').forEach((b) => (b.onclick = async () => {
      try { await call('adminSetSourceStatus', state.adminPw, b.dataset.toggleSource, b.dataset.status); loadAdmin(); }
      catch (err) { toast(errMsg(err)); }
    }));
    panel.querySelectorAll('[data-review]').forEach((b) => (b.onclick = async () => {
      try {
        await call('adminResolveReview', state.adminPw, b.dataset.review, b.dataset.action);
        toast('บันทึกแล้ว — ไฟล์จะถูกประมวลผลในรอบ sync ถัดไป');
        loadAdmin();
      } catch (err) { toast(errMsg(err)); }
    }));
  }

  show('list');
  loadBootstrap();
})();
</script>
